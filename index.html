<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Section Layout</title>
    <!-- Links to your separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Top Section (1/3 height) -->
        <header class="top-section">
            Top Large Section
        </header>

        <!-- Bottom Row containing 3 side-by-side columns (2/3 height) -->
        <main class="bottom-row">
            <section class="column left-col">Left Section</section>
            <section class="column center-col">Center Section</section>
            <section class="column right-col">Right Section</section>
        </main>
    </div>

</body>
</html>
